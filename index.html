<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF0F5">
  <title>おうちどうが</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610112034">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand" id="brand" title="長押しで おうちの人メニュー">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5.5v13l10.5-6.5z" fill="#fff"/></svg>
        </span>
        <span id="appName">おうちどうが</span>
      </div>

      <div class="timer" id="timer" aria-live="polite">
        <span class="timer-icon" aria-hidden="true">⏳</span>
        <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
        <span class="timer-text" id="timerText"></span>
      </div>
    </header>

    <main class="body">
      <section class="watch">
        <div class="shell is-paused" id="shell">
          <div class="stage">
            <div id="player"></div>
            <button class="tap-layer" id="tapLayer" aria-label="さいせい / いちじていし">
              <span class="big-play" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="48" height="48"><path d="M8 5.5v13l10.5-6.5z" fill="#fff"/></svg>
              </span>
            </button>
            <div class="stage-layer" id="endLayer" hidden>
              <p class="layer-title">おしまい</p>
              <div class="layer-actions">
                <button class="pill" id="replayBtn">もういちど みる</button>
                <button class="pill pill-primary" id="nextBtn">つぎの どうが</button>
              </div>
            </div>
            <div class="stage-layer" id="errorLayer" hidden>
              <p class="layer-title">この どうがは ここでは みられません</p>
              <p class="layer-sub">ほかの どうがを えらんでね</p>
            </div>
          </div>

          <div class="controls">
            <button class="ctrl" id="rewBtn" aria-label="10びょう もどる">
              <svg viewBox="0 0 24 24" width="26" height="26"><path d="M11 6 4 12l7 6zM20 6l-7 6 7 6z" fill="currentColor"/></svg>
            </button>
            <button class="ctrl ctrl-main" id="playBtn" aria-label="さいせい">
              <svg class="i-play" viewBox="0 0 24 24" width="30" height="30"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" width="30" height="30"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
            </button>
            <button class="ctrl" id="fwdBtn" aria-label="10びょう すすむ">
              <svg viewBox="0 0 24 24" width="26" height="26"><path d="m13 6 7 6-7 6zM4 6l7 6-7 6z" fill="currentColor"/></svg>
            </button>
            <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="さいせいいち">
            <span class="time" id="timeText">0:00 / 0:00</span>
            <button class="ctrl" id="fsBtn" aria-label="おおきく する">
              <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 3v-3h2v5h-5v-2z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <h1 class="now-title" id="nowTitle"></h1>
      </section>

      <aside class="side">
        <div class="filters" id="filters" role="tablist"></div>
        <ul class="list" id="list"></ul>
      </aside>
    </main>
  </div>

  <!-- チャレンジタイム -->
  <section class="chores" id="choreScreen" hidden>
    <div class="chores-inner">
      <h2 class="chores-title">チャレンジ タイム！</h2>
      <p class="chores-lead">おわったら、おうちの ひとに「かくにん」を おしてもらってね</p>
      <div class="chore-dots" id="choreDots" aria-hidden="true"></div>
      <div class="chore-grid" id="choreGrid"></div>
      <div class="chores-finish" id="choreFinish" hidden>
        <p class="finish-text">ぜんぶ できたね！</p>
        <button class="big-btn" id="unlockBtn">どうがを みる</button>
      </div>
    </div>
  </section>

  <!-- 暗証番号 -->
  <div class="modal" id="pinModal" hidden>
    <div class="dialog">
      <p class="dialog-title" id="pinTitle">おうちの人の 暗証番号</p>
      <div class="pin-dots" id="pinDots"></div>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>

  <!-- おうちの人メニュー -->
  <div class="modal" id="parentMenu" hidden>
    <div class="dialog dialog-wide">
      <p class="dialog-title">おうちの人メニュー</p>
      <p class="dialog-status" id="parentStatus"></p>
      <div class="menu-actions">
        <button class="pill pill-primary" id="resetBtn">タイマーをリセット（すぐ見られる状態にする）</button>
        <button class="pill" id="forceLockBtn">今すぐチャレンジタイムにする（動作確認用）</button>
        <button class="pill pill-ghost" id="closeMenuBtn">閉じる</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="videos.js?v=202610112034"></script>
  <script src="app.js?v=202610112034"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
